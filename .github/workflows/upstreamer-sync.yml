name: Upstreamer Sync

# Preserved for reference. The experiment is complete and repository Actions are disabled.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstreamer-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install opencode
        run: bun install -g opencode-ai

      - name: Sync codebases
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          UPSTREAMER_TIMEOUT_SECONDS: 7200
        run: |
          status=0
          ./scripts/upstream tstack || status=$?
          ./scripts/upstream last30days-ts || status=$?
          exit "$status"

      - name: Verify public skill discovery
        run: ./scripts/verify-public-skills

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: upstreamer/scheduled-sync
          delete-branch: true
          title: "Sync downstream codebases with upstream"
          commit-message: "Sync downstream codebases with upstream"
          body: |
            Automated upstreamer sync for configured downstream codebases.

            This preserved workflow has no automatic trigger. If explicitly re-enabled and run manually, it opens a PR only when generated outputs, state, or eval reports changed.
          labels: upstreamer, automated
