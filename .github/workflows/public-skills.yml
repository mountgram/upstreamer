name: Public Skills

# Preserved for reference. The experiment is complete and repository Actions are disabled.
on:
  workflow_dispatch:

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify public skill discovery
        run: ./scripts/verify-public-skills
